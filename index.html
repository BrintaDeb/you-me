    <meta name="color-scheme" content="dark light" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('youandme_theme') || localStorage.getItem('theme');
          var theme = (saved === 'burgundy') ? 'burgundy' : 'white';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-color-scheme', theme === 'white' ? 'light' : 'dark');
          document.documentElement.style.colorScheme = theme === 'white' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
